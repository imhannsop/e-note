<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eeede7" />
    <title>ink · offline</title>
    <style>
      :root { --bg: #eeede7; --fg: #1b1b1a; --accent: #c8321f; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f1f1d; --fg: #deddd6; --accent: #f06a55; }
      }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 16px; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, sans-serif; text-align: center;
      }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
      p { margin: 0 0 1.5rem; opacity: 0.6; }
      button {
        font: inherit; color: var(--bg); background: var(--fg);
        border: 0; border-radius: 999px; padding: 0.6rem 1.4rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 120 40" width="120" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M6 28c8-14 14-20 18-18s-6 18-2 18 10-16 14-16-2 16 2 16 8-12 12-14 4 12 8 12 10-18 16-18-6 18 0 18 12-10 18-12 8 8 14 6" />
        <circle cx="112" cy="26" r="2.5" fill="var(--accent)" stroke="none" />
      </svg>
      <h1>You're offline</h1>
      <p>The ink will be here when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
