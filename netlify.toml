[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Public by design: bundled into the browser.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
  # Turbopack's build cache; never deployed.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
